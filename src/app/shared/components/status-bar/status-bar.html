<div class="stepper">
  @for (step of steps; let i = $index; track step) {
    <div class="stepper__labels">
      <div class="stepper__circle" [class.active]="i <= currentIndex()">
        <span [class.active]="i <= 2">✓</span>
      </div>
      <div class="stepper__label">
        {{ step }}
      </div>
    </div>
    @if (i < steps.length - 1) {
      <div class="stepper__line" [class.active]="i <= currentIndex() - 1"></div>
    }
  }
</div>
