<div class="pg-card__content">
  @for (g of goals.segmentedGoals(); track g.id) {
    <app-segmented-goal-bar [goal]="g" />
  }

  <app-progress-bar
    class="pg-card-progress"
    title="New business target"
    [value]="68"
    [currentSum]="8.1"
    [targetSum]="12"
  >
  </app-progress-bar>
  <app-progress-bar title="Annual GWP Target" [value]="68" [currentSum]="8.1" [targetSum]="12">
  </app-progress-bar>
</div>
